name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels the previous, now outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quizforge
          POSTGRES_USER: quizforge
          POSTGRES_PASSWORD: quizforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quizforge -d quizforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-insecure-secret-key-for-tests-only-0123456789
      DATABASE_URL: postgres://quizforge:quizforge@localhost:5432/quizforge

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      # prettier/eslint need node_modules; the frontend job runs them instead
      - name: pre-commit
        working-directory: .
        env:
          SKIP: prettier,eslint
        run: pre-commit run --all-files --show-diff-on-failure

      - name: mypy
        run: mypy .

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null

      - name: Tests
        run: pytest --cov

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --target dev -t quizforge-backend:ci backend

      - name: Build frontend image
        run: docker build -t quizforge-frontend:ci frontend
